//file:noinspection GroovyAssignabilityCheck

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    accessTransformers.from project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = rootDir.toString() + "/runs/client"
        }
        data {
            data()
            programArguments.addAll '--all', '--mod', "${mod_id}", '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            gameDirectory = rootDir.toString() + "/runs/server"
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    jarJar(additionalRuntimeClasspath "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}")
    jarJar(additionalRuntimeClasspath "org.jetbrains.kotlin:kotlin-reflect:${kotlin_version}")
    // https://modrinth.com/mod/jade/version/15.10.5+neoforge
    runtimeOnly "maven.modrinth:nvQzSEkH:yd8FKCmx"
    // https://modrinth.com/mod/pipez/version/neoforge-1.21.1-1.2.31
    runtimeOnly "maven.modrinth:iRmWy6ga:BPGKb8pi"
}